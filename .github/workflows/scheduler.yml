name: Routine scheduler

# Starts the Morning Brief routines at the times set in the app. See .github/scripts/scheduler.py.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only report what is due; start nothing"
        type: boolean
        default: true

permissions:
  contents: write # only for the keep-alive commit below

concurrency:
  group: scheduler
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Start routines that are due
        env:
          SCHEDULER_TOKEN: ${{ secrets.SCHEDULER_TOKEN }}
          VAULTS: jasonjj333/pariveda-notes jasonjj333/personal-brief
          DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: python3 .github/scripts/scheduler.py
      # GitHub turns off scheduled workflows in a repo with no commits for 60 days. Commit a date once a month.
      - name: Keep the schedule alive
        run: |
          last=$(git log -1 --format=%ct)
          [ $(( $(date +%s) - last )) -lt $(( 40 * 86400 )) ] && exit 0
          date -u +%F > .github/keepalive
          git config user.name "Morning Brief"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/keepalive
          git commit -m "Keep the routine scheduler running"
          git push
