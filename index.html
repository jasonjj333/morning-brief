<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://api.github.com; base-uri 'none'; form-action 'none'">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex, nofollow">
  <title>Morning Brief</title>
  <meta name="description" content="Jason's daily brief for work and personal email, read live from his private repos.">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Brief">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://api.github.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=Instrument+Serif&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/app.css">
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <div id="app" class="app">
    <nav class="tabbar" aria-label="Sections">
      <div class="brand">
        <svg class="mark" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="9" fill="var(--accent)"/><path d="M8 21a8 8 0 0 1 16 0" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/><path d="M6.5 24.5h19" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/></svg>
        <div class="brand-text">
          <span class="brand-name">Morning Brief</span>
          <span class="brand-scope" data-bind="scope">Pariveda notes</span>
        </div>
      </div>
      <div class="side-profiles" role="tablist" aria-label="Profile">
        <span class="profile-thumb" aria-hidden="true"></span>
        <button type="button" role="tab" data-switch="work" aria-selected="true"><span class="profile-dot profile-work" aria-hidden="true"></span>Work</button>
        <button type="button" role="tab" data-switch="personal" aria-selected="false"><span class="profile-dot profile-personal" aria-hidden="true"></span>Personal</button>
        <button type="button" role="tab" data-switch="project" aria-selected="false"><span class="profile-dot profile-project" aria-hidden="true"></span>Project</button>
      </div>
      <div class="tabs" role="tablist"></div>
      <div class="sidebar-foot">
        <span class="fresh" data-bind="fresh"></span>
        <button class="side-btn" type="button" data-action="settings">Settings</button>
      </div>
    </nav>
    <main class="stage" id="stage"></main>
  </div>
  <div class="sheet-layer" id="sheets"></div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <noscript><p class="noscript">Morning Brief needs JavaScript to read your notes.</p></noscript>
</body>
</html>
